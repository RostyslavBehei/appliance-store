<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{order.page.title}">My Orders - Appliance Store</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<header th:insert="~{header::navy}"></header>

<main class="flex-grow-1 py-5">
    <div class="container">
        <h2 class="fw-bold mb-4" th:text="#{order.title}">📦 My Orders</h2>

        <div th:if="${orders == null or orders.isEmpty()}" class="text-center py-5 bg-white rounded shadow-sm border">
            <i class="ri-file-list-3-line text-secondary mb-3" style="font-size: 4rem;"></i>
            <h3 class="text-dark fw-bold" th:text="#{order.list.isEmpty}">You haven't placed any orders yet</h3>
            <p class="text-muted" th:text="#{order.list.isEmpty.description}">Looks like your order history is empty. Time to change that!</p>
            <a href="/" class="btn btn-primary rounded-pill mt-3 px-4">
                <i class="ri-arrow-left-line me-1"></i> <span th:text="#{order.list.isEmpty.button.back}">Go to catalog</span>
            </a>
        </div>

        <div th:if="${orders != null and !orders.isEmpty()}" class="d-flex flex-column gap-4">

            <div class="card border-0 rounded shadow-sm" th:each="order : ${orders}">

                <div class="card-header bg-white border-bottom p-4 d-flex justify-content-between align-items-center flex-wrap gap-2">
                    <div>
                        <h5 class="fw-bold mb-1">
                            <span th:text="#{order.list.number}">Order #</span>
                            <span th:text="${order.id}">0</span>
                        </h5>
                        <p class="text-muted small mb-0">
                            <i class="ri-calendar-line align-middle"></i>
                            <span th:text="#{order.list.date}">Date:</span>
                            <span th:text="${#temporals.format(order.createdAt, 'dd-MM-yyyy HH:mm')}">01-01-2026</span>
                        </p>
                    </div>

                    <div class="text-end">
                        <!-- Order status -->
                        <span th:if="${order.approved}" class="badge bg-success bg-opacity-10 text-success border border-success-subtle px-3 py-2 rounded-pill fs-6 mb-2 d-inline-block">
                            <i class="ri-check-line align-middle me-1"></i>
                            <span th:text="#{order.list.status.approved}">Approved</span>
                        </span>
                        <span th:unless="${order.approved}" class="badge bg-warning bg-opacity-10 text-warning border border-warning-subtle px-3 py-2 rounded-pill fs-6 mb-2 d-inline-block">
                            <i class="ri-time-line align-middle me-1"></i>
                            <span th:text="#{order.list.status.pending}">Pending processing</span>
                        </span>

                        <h5 class="fw-bold text-primary mb-0">
                            <span th:text="#{order.list.total}">Total:</span>
                            <span th:text="${#numbers.formatDecimal(order.totalPrice, 1, 2)}">0.00</span> $
                        </h5>
                    </div>
                </div>

                <!-- Order Body -->
                <div class="card-body p-0">
                    <ul class="list-group list-group-flush">

                        <li class="list-group-item p-4 d-flex align-items-center" th:each="row : ${order.orderRowResponses}">

                            <!-- Appliance Logo -->
                            <div class="bg-secondary bg-opacity-10 rounded d-flex align-items-center justify-content-center me-4" style="width: 60px; height: 60px;">
                                <i class="ri-macbook-line text-secondary fs-3"></i>
                            </div>

                            <!-- Name & Quantity -->
                            <div class="flex-grow-1">
                                <h6 class="fw-bold mb-1">
                                    <a th:href="@{/appliances/{id}(id=${row.appliance.id})}" class="text-dark text-decoration-none" th:text="${row.appliance.name}">Appliance Name</a>
                                </h6>
                                <p class="text-muted small mb-0">
                                    <span th:text="${#numbers.formatDecimal(row.appliance.price, 1, 2)}">0.00</span> $
                                    <span class="mx-1">×</span>
                                    <span class="fw-medium" th:text="${row.number}">1</span>
                                    <span th:text="#{order.list.pcs}">pcs.</span>
                                </p>
                            </div>

                            <!-- Sum of specific appliance -->
                            <div class="fw-bold text-dark">
                                <span th:text="${#numbers.formatDecimal(row.amount, 1, 2)}">0.00</span> $
                            </div>

                        </li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
