<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{checkout.title}">Checkout - Appliance Store</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<header th:insert="~{header::navy}"></header>

<main class="flex-grow-1 py-5">
    <div class="container">
        <div class="d-flex align-items-center mb-4">
            <a th:href="@{/cart}" class="text-decoration-none text-muted me-3 fs-4">
                <i class="ri-arrow-left-line"></i>
            </a>
            <h2 class="fw-bold mb-0" th:text="#{checkout.title}">Checkout</h2>
        </div>

        <form th:action="@{/orders}" method="post" th:object="${checkoutRequest}" class="js-save-form">
            <div class="row g-4">

                <div class="col-lg-8">
                    <div class="card border-0 rounded shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3 d-flex align-items-center">
                                <i class="ri-user-line text-primary me-2"></i>
                                <span th:text="#{checkout.contact.info}">Contact Information</span>
                            </h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" th:text="#{checkout.first.name}">First Name</label>
                                    <input type="text" class="form-control" th:field="*{firstName}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" th:text="#{checkout.last.name}">Last Name</label>
                                    <input type="text" class="form-control" th:field="*{lastName}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" th:text="#{checkout.email}">Email Address</label>
                                    <input type="email" class="form-control" th:field="*{email}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" th:text="#{checkout.phone}">Phone Number</label>
                                    <input type="tel" class="form-control" th:field="*{phone}" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 rounded shadow-sm mb-4">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3 d-flex align-items-center">
                                <i class="ri-map-pin-line text-primary me-2"></i>
                                <span th:text="#{checkout.shipping.address}">Shipping Address</span>
                            </h5>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label" th:text="#{checkout.country}">Country</label>
                                    <select class="form-select" th:field="*{country}" required>
                                        <option value="UA">Ukraine</option>
                                        <option value="US">United States</option>
                                        <option value="UK">United Kingdom</option>
                                        <option value="PL">Poland</option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" th:text="#{checkout.city}">City</label>
                                    <input type="text" class="form-control" th:field="*{city}" required>
                                </div>
                                <div class="col-12">
                                    <label class="form-label" th:text="#{checkout.street}">Street Address</label>
                                    <input type="text" class="form-control" th:field="*{street}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label" th:text="#{checkout.zip}">Zip / Postal Code</label>
                                    <input type="text" class="form-control" th:field="*{zipCode}" required>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="card border-0 rounded shadow-sm mb-3">
                        <div class="card-body p-4">
                            <h5 class="fw-bold mb-3 d-flex align-items-center">
                                <i class="ri-bank-card-line text-primary me-2"></i>
                                <span th:text="#{checkout.payment.method}">Payment Method</span>
                            </h5>
                            <div class="form-check mb-2">
                                <input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="CASH">
                                <label class="form-check-label" th:for="${#ids.prev('paymentMethod')}" th:text="#{checkout.payment.cash}">
                                    Cash on Delivery
                                </label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" th:field="*{paymentMethod}" value="CARD">
                                <label class="form-check-label" th:for="${#ids.prev('paymentMethod')}" th:text="#{checkout.payment.card}">
                                    Credit Card
                                </label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="col-lg-4">
                    <div class="card border-0 rounded shadow-sm sticky-top" style="top: 2rem;">
                        <div class="card-body p-4">
                            <h4 class="fw-bold mb-4" th:text="#{checkout.order.summary}">Order Summary</h4>

                            <ul class="list-group list-group-flush mb-3">
                                <th:block th:each="cart : ${carts}">
                                    <li class="list-group-item px-0 py-2 d-flex justify-content-between align-items-start border-bottom-0" th:each="item : ${cart.cartItems}">
                                        <div class="d-flex">
                                            <span class="badge bg-secondary me-2 mt-1" th:text="${item.quantity}">1</span>
                                            <div>
                                                <span class="d-block small fw-medium text-dark" th:text="${item.appliance.name}">Appliance</span>
                                            </div>
                                        </div>
                                        <span class="small fw-bold text-dark text-nowrap ms-2">
                                            <span th:text="${#numbers.formatDecimal(item.sum, 1, 2)}">0.00</span> $
                                        </span>
                                    </li>
                                </th:block>
                            </ul>

                            <hr class="my-3 opacity-25">

                            <div class="d-flex justify-content-between mb-2 text-muted">
                                <span><span th:text="#{checkout.order.items}">Products</span>:</span>
                                <span class="fw-medium" th:text="${totalItems}">0</span>
                            </div>

                            <div class="d-flex justify-content-between mb-3 text-muted">
                                <span th:text="#{checkout.delivery}">Delivery:</span>
                                <span class="fw-medium text-success" th:text="#{checkout.delivery.free}">Free</span>
                            </div>

                            <hr class="my-3">

                            <div class="d-flex justify-content-between mb-4">
                                <span class="text-dark fw-bold fs-5" th:text="#{checkout.order.total}">Total to Pay:</span>
                                <span class="fw-bold fs-4 text-primary"><span th:text="${#numbers.formatDecimal(totalSum, 1, 2)}">0.00</span> $</span>
                            </div>

                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm">
                                <span th:text="#{checkout.place.order}">Place Order</span> <i class="ri-check-line ms-1"></i>
                            </button>

                            <a th:href="@{/cart}" class="btn btn-link w-100 text-decoration-none mt-2 text-muted">
                                <i class="ri-arrow-left-line me-1"></i> <span th:text="#{checkout.back.cart}">Back to Cart</span>
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </form>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/form-saver.js}"></script>
</body>
</html>
