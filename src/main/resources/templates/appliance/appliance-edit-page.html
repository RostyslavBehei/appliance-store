<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{appliance.edit.page_title}">Edit Appliance - Appliance Store</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<header th:insert="~{header::navy}"></header>

<main class="flex-grow-1 py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card border-0 rounded shadow-sm">
                    <div class="card-header bg-white border-bottom p-4 d-flex justify-content-between align-items-center">
                        <h4 class="fw-bold mb-0 text-primary">
                            <i class="ri-edit-2-line me-2"></i><span th:text="#{appliance.edit.title}">Edit Appliance</span>
                        </h4>
                        <a th:href="@{/appliances/{id}(id=${appliance.id})}" class="btn btn-sm btn-outline-secondary">
                            <i class="ri-arrow-left-line me-1"></i> <span th:text="#{appliance.edit.button.cancel}">Cancel</span>
                        </a>
                    </div>
                    <div class="card-body p-4">

                        <form th:action="@{/appliances/edit}" method="post" class>

                            <input type="hidden" name="id" th:value="${appliance.id}" />

                            <div class="row g-3">
                                <!-- Appliance Name -->
                                <div class="col-md-8">
                                    <label class="form-label text-muted small mb-1" th:text="#{appliance.edit.name}">Product Name</label>
                                    <input type="text" class="form-control" name="name" th:value="${appliance.name}" required>
                                </div>

                                <!-- Model -->
                                <div class="col-md-4">
                                    <label class="form-label text-muted small mb-1" th:text="#{appliance.edit.model}">Model</label>
                                    <input type="text" class="form-control" name="model" th:value="${appliance.model}" required>
                                </div>

                                <!-- Manufacturer -->
                                <div class="col-md-6">
                                    <label class="form-label text-muted small mb-1" th:text="#{appliance.edit.manufacturer}">Manufacturer</label>
                                    <select class="form-select" name="manufacturerId" required>
                                        <option value="" disabled th:text="#{appliance.edit.select_manufacturer}">-- Select Manufacturer --</option>
                                        <option th:each="man : ${manufacturers}"
                                                th:value="${man.id}"
                                                th:text="${man.name}"
                                                th:selected="${man.name == appliance.manufacturerName}">
                                        </option>
                                    </select>
                                </div>

                                <!-- Category -->
                                <div class="col-md-6">
                                    <label class="form-label text-muted small mb-1" th:text="#{appliance.edit.category}">Category</label>
                                    <select class="form-select" name="category" required>
                                        <option th:each="cat : ${categories}"
                                        th:value="${cat.name()}"
                                        th:text="${cat.name()}"
                                        th:selected="${cat.name() == appliance.category}"></option>
                                    </select>
                                </div>

                                <!-- Price -->
                                <div class="col-md-4">
                                    <label class="form-label text-muted small mb-1" th:text="#{appliance.edit.price}">Price ($)</label>
                                    <div class="input-group">
                                        <span class="input-group-text bg-light">$</span>
                                        <input type="number" step="0.01" min="0" class="form-control" name="price" th:value="${appliance.price}" required>
                                    </div>
                                </div>

                                <!-- Power Type -->
                                <div class="col-md-4">
                                    <label class="form-label text-muted small mb-1" th:text="#{appliance.edit.power_type}">Power Type</label>
                                    <select class="form-select" name="powerType" required>
                                        <option th:each="power : ${powerTypes}"
                                        th:value="${power.name()}"
                                        th:text="${power.name()}"
                                        th:selected="${power.name() == appliance.powerType}"></option>
                                    </select>
                                </div>

                                <!-- Power -->
                                <div class="col-md-4">
                                    <label class="form-label text-muted small mb-1" th:text="#{appliance.edit.power}">Power (W)</label>
                                    <input type="number" min="0" class="form-control" name="power" th:value="${appliance.power}" required>
                                </div>

                                <!-- Characteristic -->
                                <div class="col-12">
                                    <label class="form-label text-muted small mb-1" th:text="#{appliance.edit.characteristic}">Characteristics</label>
                                    <input type="text" class="form-control" name="characteristic" th:value="${appliance.characteristic}">
                                </div>

                                <!-- Description -->
                                <div class="col-12">
                                    <label class="form-label text-muted small mb-1" th:text="#{appliance.edit.description}">Description</label>
                                    <textarea class="form-control" name="description" rows="4" required th:text="${appliance.description}"></textarea>
                                </div>
                            </div>

                            <hr class="my-4">

                            <!-- Submit Button -->
                            <div class="text-end">
                                <button type="submit" class="btn btn-primary px-4 fw-medium shadow-sm">
                                    <i class="ri-save-3-line me-1 align-middle"></i> <span th:text="#{appliance.edit.button.save}">Save Changes</span>
                                </button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>
        </div>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/form-saver.js}"></script>
</body>
</html>
