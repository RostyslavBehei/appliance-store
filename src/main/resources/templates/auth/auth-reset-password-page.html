<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.reset_password.page_title}">Reset Password - Appliance Store</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                            <i class="ri-key-2-line fs-2"></i>
                        </div>
                        <h4 class="fw-bold text-dark" th:text="#{auth.reset_password.title}">Create New Password</h4>
                        <p class="text-muted small mb-0" th:text="#{auth.reset_password.description}">
                            Your new password must be different from previous used passwords.
                        </p>
                    </div>

                    <form th:action="@{/reset-password}" method="post">

                        <!-- Приховане поле для токена (береться з URL /reset-password?token=...) -->
                        <input type="hidden" name="token" th:value="${param.token}">

                        <div class="mb-3">
                            <label class="form-label fw-medium text-dark small" th:text="#{auth.reset_password.new}">New Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 text-muted"><i class="ri-lock-line"></i></span>
                                <input type="password" name="newPassword" class="form-control bg-light border-0 form-control-lg fs-6"
                                       th:placeholder="#{auth.reset_password.new_placeholder}" required autofocus minlength="6">
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-medium text-dark small" th:text="#{auth.reset_password.confirm}">Confirm Password <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 text-muted"><i class="ri-lock-check-line"></i></span>
                                <!-- Атрибут name збігається з полем confirmPassword у UserPasswordResetRequest -->
                                <input type="password" name="confirmPassword" class="form-control bg-light border-0 form-control-lg fs-6"
                                       th:placeholder="#{auth.reset_password.confirm_placeholder}" required minlength="6">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill shadow-sm fw-medium py-2">
                            <i class="ri-save-line me-1"></i> <span th:text="#{auth.reset_password.btn_submit}">Reset Password</span>
                        </button>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control {
        background-color: #fff !important;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        border: 1px solid #dee2e6;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/form-saver.js}"></script>
</body>
</html>
