<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{register.page_title}">Sign Up - Appliance Store</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Remix Icon -->
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- Main CSS -->
    <link rel="stylesheet" th:href="@{/css/main.css}">

    <link rel="icon" href="data:,">

    <style>
        .login-cart {
            border-radius: 1.5rem;
            border: none;
        }
        .form-floating > .form-control:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 0.25rem rgba(37, 99, 235, 0.15);
        }
        .form-floating > .form-control {
            border-radius: 0.75rem;
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
        }
        .login-icon-wrapper {
            width: 80px;
            height: 80px;
            background-color: #eff6ff;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto;
        }
    </style>
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<header th:insert="~{header::navy}"></header>

<main class="flex-grow-1 d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">

                <div class="cart login-cart shadow-lg p-4 p-sm-5 bg-white">

                    <div class="text-center mb-4">
                        <div class="login-icon-wrapper mb-3">
                            <i class="ri-user-add-line text-primary" style="font-size: 2.5rem;"></i>
                        </div>
                        <h2 class="fw-bold" th:text="#{register.title}">Create an Account</h2>
                        <p class="text-muted" th:text="#{register.subtitle}">Join Appliance Store today</p>
                    </div>

                    <!-- Error Block -->
                    <div th:if="${param.error != null or errorMessage != null}" class="alert alert-danger border-0 rounded-3 d-flex align-items-center" role="alert">
                        <i class="ri-error-warning-line fs-5 me-2"></i>
                        <div th:if="${errorMessage != null}" th:text="${errorMessage}">An error occurred.</div>
                        <div th:unless="${errorMessage != null}" th:text="#{register.error}">An account with this email already exists.</div>
                    </div>

                    <!-- Registration Form -->
                    <form th:action="@{/register}" method="post" th:object="${registerRequest}" class="js-save-form" id="registerForm">

                        <!-- First Name & Last Name -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="firstName" th:field="*{firstName}" placeholder="Іван" required autofocus>
                                    <label for="firstName" class="text-muted">
                                        <i class="ri-user-line me-1"></i> <span th:text="#{register.first_name}">First Name</span>
                                    </label>
                                </div>
                            </div>
                            <div class="col-md-6 mb-3">
                                <div class="form-floating">
                                    <input type="text" class="form-control" id="lastName" th:field="*{lastName}" placeholder="Шевченко" required>
                                    <label for="lastName" class="text-muted">
                                        <i class="ri-user-line me-1"></i> <span th:text="#{register.last_name}">Last Name</span>
                                    </label>
                                </div>
                            </div>
                        </div>

                        <!-- Middle Name -->
                        <div class="form-floating mb-3">
                            <input type="text" class="form-control" id="middleName" th:field="*{middleName}" placeholder="Шевченкович" required>
                            <label for="middleName" class="text-muted">
                                <i class="ri-user-line me-1"></i> <span th:text="#{register.middle_name}">Middle Name</span>
                            </label>
                        </div>

                        <!-- Email -->
                        <div class="form-floating mb-3">
                            <input type="email" class="form-control" id="email" th:field="*{email}" placeholder="name@example.com" required>
                            <label for="email" class="text-muted">
                                <i class="ri-mail-line me-1"></i> <span th:text="#{register.email}">Email Address</span>
                            </label>
                        </div>

                        <!-- Birthday -->
                        <div class="form-floating mb-3">
                            <input type="date" class="form-control" id="birthday" th:field="*{birthday}" required>
                            <label for="birthday" class="text-muted">
                                <i class="ri-calendar-line me-1"></i> <span th:text="#{register.birthday}">Birthday</span>
                            </label>
                        </div>

                        <!-- Password -->
                        <div class="form-floating mb-3">
                            <input type="password" class="form-control" id="password" th:field="*{password}" placeholder="Password" required minlength="6">
                            <label for="password" class="text-muted">
                                <i class="ri-lock-password-line me-1"></i> <span th:text="#{register.password}">Password</span>
                            </label>
                        </div>

                        <!-- Confirm Password -->
                        <div class="form-floating mb-4">
                            <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required minlength="6">
                            <label for="confirmPassword" class="text-muted">
                                <i class="ri-lock-password-fill me-1"></i> <span th:text="#{register.confirm_password}">Confirm Password</span>
                            </label>
                        </div>

                        <!-- Submit Button -->
                        <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm">
                            <span th:text="#{register.submit}">Sign Up</span> <i class="ri-arrow-right-up-line ms-1"></i>
                        </button>
                    </form>

                    <!-- Back to Login Page -->
                    <div class="text-center mt-4 pt-3 border-top">
                        <span class="text-muted" th:text="#{register.has_account}">Already have an account?</span>
                        <a href="/login" class="text-decoration-none fw-bold ms-1" th:text="#{register.login_link}">Sign in here</a>
                    </div>

                </div>
            </div>
        </div>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/form-saver.js}"></script>
</body>
</html>
