<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{auth.forgot_password.page_title}">Forgot Password - Appliance Store</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5 col-xl-4">

            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-body p-4 p-md-5">

                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center bg-primary bg-opacity-10 text-primary rounded-circle mb-3" style="width: 64px; height: 64px;">
                            <i class="ri-lock-password-line fs-2"></i>
                        </div>
                        <h4 class="fw-bold text-dark" th:text="#{auth.forgot_password.title}">Forgot Password?</h4>
                        <p class="text-muted small mb-0" th:text="#{auth.forgot_password.description}">
                            Enter your registered email address and we will send you a link to reset your password.
                        </p>
                    </div>

                    <!-- Alert: Email not found -->
                    <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-3 d-flex align-items-center mb-4" role="alert">
                        <i class="ri-error-warning-line fs-5 me-2 flex-shrink-0"></i>
                        <div class="small" th:text="#{auth.forgot_password.email_not_found}">No account found with this email address.</div>
                    </div>

                    <!-- Alert: Other errors -->
                    <div th:if="${generalError}" class="alert alert-danger border-0 rounded-3 d-flex align-items-center mb-4" role="alert">
                        <i class="ri-error-warning-line fs-5 me-2 flex-shrink-0"></i>
                        <div class="small" th:text="${generalError}">An error occurred. Please try again.</div>
                    </div>

                    <form th:action="@{/forgot-password}" method="post">

                        <div class="mb-4">
                            <label class="form-label fw-medium text-dark small" th:text="#{auth.forgot_password.email}">Email Address <span class="text-danger">*</span></label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 text-muted"><i class="ri-mail-line"></i></span>
                                <input type="email" name="email" class="form-control bg-light border-0 form-control-lg fs-6"
                                       th:value="${emailValue}"
                                       th:placeholder="#{auth.forgot_password.email_placeholder}" required autofocus>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 rounded-pill shadow-sm fw-medium py-2 mb-4">
                            <i class="ri-mail-send-line me-1"></i> <span th:text="#{auth.forgot_password.btn_submit}">Send Reset Link</span>
                        </button>

                        <div class="text-center">
                            <a th:href="@{/login}" class="text-decoration-none text-muted small fw-medium custom-link">
                                <i class="ri-arrow-left-line align-middle"></i> <span th:text="#{auth.forgot_password.back_to_login}">Back to Login</span>
                            </a>
                        </div>

                    </form>
                </div>
            </div>

        </div>
    </div>
</div>

<style>
    .custom-link:hover {
        color: #0d6efd !important;
        transition: color 0.2s ease-in-out;
    }
    .input-group:focus-within .input-group-text,
    .input-group:focus-within .form-control {
        background-color: #fff !important;
        box-shadow: 0 0 0 0.25rem rgba(13, 110, 253, 0.15);
        border: 1px solid #dee2e6;
    }
</style>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/form-saver.js}"></script>
</body>
</html>
