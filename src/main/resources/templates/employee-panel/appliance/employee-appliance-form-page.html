<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{employee.appliances.form.title}">Add New Appliance - Employee Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{employee-panel/employee-sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">

        <div class="mb-4">
            <a th:href="@{/employee-panel/appliances}" class="text-decoration-none text-muted small d-inline-flex align-items-center mb-2">
                <i class="ri-arrow-left-line me-1"></i> <span th:text="#{employee.appliances.form.back}">Back to Catalog</span>
            </a>
            <h3 class="fw-bold mb-0 text-dark" th:text="#{employee.appliances.form.title}">Add New Appliance</h3>
            <p class="text-muted small mb-0" th:text="#{employee.appliances.form.subtitle}">Fill in details, technical specifications, and assign a manufacturer.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-12 col-xl-10">

                <div class="card border-0 shadow-sm rounded-4">
                    <div class="card-body p-4 p-md-5">

                        <form th:action="@{/employee-panel/appliances/new}" method="post" th:object="${applianceRequest}">

                            <div th:if="${#fields.hasErrors('*')}" class="alert alert-danger border-0 rounded-3 mb-4">
                                <div class="d-flex align-items-center mb-1">
                                    <i class="ri-error-warning-line fs-5 me-2"></i>
                                    <strong th:text="#{employee.appliances.form.validation_error}">Please fix the following errors:</strong>
                                </div>
                                <ul class="mb-0 ps-4 small">
                                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}">Error</li>
                                </ul>
                            </div>

                            <!-- Basic Info -->
                            <h5 class="fw-bold text-dark border-bottom pb-2 mb-4">
                                <i class="ri-information-line text-primary me-2"></i><span th:text="#{employee.appliances.form.section.basic}">General Information</span>
                            </h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label class="form-label fw-medium text-dark" th:text="#{employee.appliances.form.name}">Appliance Name *</label>
                                    <input type="text" class="form-control bg-light border-0 py-2" th:field="*{name}" placeholder="e.g. EcoSilence Washing Machine" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium text-dark" th:text="#{employee.appliances.form.model}">Model Identifier *</label>
                                    <input type="text" class="form-control bg-light border-0 py-2" th:field="*{model}" placeholder="e.g. WAN28200UA" required>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium text-dark" th:text="#{employee.appliances.form.manufacturer}">Manufacturer *</label>
                                    <select class="form-select bg-light border-0 py-2" th:field="*{manufacturerId}" required>
                                        <option value="" disabled selected th:text="#{employee.appliances.form.select_manufacturer}">Select brand...</option>
                                        <option th:each="m : ${manufacturers}" th:value="${m.id()}" th:text="${m.name()}">Bosch</option>
                                    </select>
                                </div>

                                <div class="col-md-6">
                                    <label class="form-label fw-medium text-dark" th:text="#{employee.appliances.form.category}">Category *</label>
                                    <select class="form-select bg-light border-0 py-2" th:field="*{category}" required>
                                        <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}">BIG</option>
                                    </select>
                                </div>
                            </div>

                            <!-- Technical Specs & Pricing -->
                            <h5 class="fw-bold text-dark border-bottom pb-2 mb-4">
                                <i class="ri-settings-4-line text-primary me-2"></i><span th:text="#{employee.appliances.form.section.specs}">Specifications & Pricing</span>
                            </h5>

                            <div class="row g-3 mb-4">
                                <div class="col-md-4">
                                    <label class="form-label fw-medium text-dark" th:text="#{employee.appliances.form.power_type}">Power Type *</label>
                                    <select class="form-select bg-light border-0 py-2" th:field="*{powerType}" required>
                                        <option th:each="pt : ${powerTypes}" th:value="${pt}" th:text="${pt}">ACCUMULATOR</option>
                                    </select>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-medium text-dark" th:text="#{employee.appliances.form.power}">Power (Watts) *</label>
                                    <input type="number" min="0" step="1" class="form-control bg-light border-0 py-2" th:field="*{power}" placeholder="e.g. 2200" required>
                                </div>

                                <div class="col-md-4">
                                    <label class="form-label fw-medium text-dark" th:text="#{employee.appliances.form.price}">Price ($) *</label>
                                    <input type="number" min="0" step="0.01" class="form-control bg-light border-0 py-2" th:field="*{price}" placeholder="e.g. 499.99" required>
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-medium text-dark" th:text="#{employee.appliances.form.characteristic}">Characteristics</label>
                                    <input type="text" class="form-control bg-light border-0 py-2" th:field="*{characteristic}" placeholder="e.g. Inverter Motor, 8kg capacity, 1400 RPM">
                                </div>

                                <div class="col-12">
                                    <label class="form-label fw-medium text-dark" th:text="#{employee.appliances.form.description}">Description</label>
                                    <textarea rows="4" class="form-control bg-light border-0" th:field="*{description}" placeholder="Detailed appliance description..."></textarea>
                                </div>
                            </div>

                            <div class="d-flex justify-content-end gap-2 pt-3 border-top">
                                <a th:href="@{/employee-panel/appliances}" class="btn btn-light rounded-pill px-4" th:text="#{employee.appliances.form.cancel}">Cancel</a>
                                <button type="submit" class="btn btn-primary rounded-pill px-4 fw-medium shadow-sm">
                                    <i class="ri-check-line me-1"></i> <span th:text="#{employee.appliances.form.save}">Create Appliance</span>
                                </button>
                            </div>

                        </form>

                    </div>
                </div>

            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
