<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{employee.clients.page_title}">Clients - Employee Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{employee-panel/employee-sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h3 class="fw-bold mb-1 text-dark" th:text="#{employee.clients.title}">Customer Directory</h3>
                <p class="text-muted small mb-0" th:text="#{employee.clients.subtitle}">View registered customers and their account activity.</p>
            </div>

            <div class="d-flex align-items-center bg-white px-3 py-2 rounded shadow-sm border-0">
                <i class="ri-user-settings-line text-primary me-2 fs-5"></i>
                <span class="text-muted fw-medium" th:text="${#authentication.name}">employee@store.com</span>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-3">
                <form th:action="@{/employee-panel/clients}" method="get" class="row g-2 align-items-center">
                    <!-- Фіксуємо size у формі пошуку -->
                    <input type="hidden" name="size" th:value="${size}">

                    <div class="col-md-9 col-lg-10">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 text-muted ps-3">
                                <i class="ri-search-line"></i>
                            </span>
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control bg-light border-0 py-2"
                                   th:placeholder="#{employee.clients.search_placeholder}">
                        </div>
                    </div>
                    <div class="col-md-3 col-lg-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-medium">
                            <span th:text="#{employee.clients.btn.search}">Search</span>
                        </button>
                        <a th:if="${keyword != null and !#strings.isEmpty(keyword)}"
                           th:href="@{/employee-panel/clients(size=${size})}"
                           class="btn btn-light border rounded-pill px-3">
                            <i class="ri-close-line"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-borderless align-middle mb-0">
                        <thead class="table-light text-muted small border-bottom">
                        <tr>
                            <th class="ps-4" style="width: 15%;" th:text="#{employee.clients.table.id}">ID</th>
                            <th style="width: 45%;" th:text="#{employee.clients.table.client}">Client Name</th>
                            <th style="width: 25%;" th:text="#{employee.clients.table.email}">Email</th>
                            <th class="text-end pe-4" style="width: 15%;" th:text="#{employee.clients.table.actions}">Actions</th>
                        </tr>
                        </thead>
                        <tbody>

                        <tr th:if="${clients == null or #lists.isEmpty(clients.content)}">
                            <td colspan="4" class="text-center text-muted py-5">
                                <i class="ri-user-unfollow-line fs-1 d-block mb-2 text-secondary opacity-50"></i>
                                <span th:text="#{employee.clients.empty}">No clients found.</span>
                            </td>
                        </tr>

                        <tr th:each="client : ${clients?.content}">
                            <td class="ps-4">
                                <span class="fw-bold text-primary" th:text="'#' + ${client.id()}">#1</span>
                            </td>

                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 38px; height: 38px;">
                                        <i class="ri-user-3-line"></i>
                                    </div>
                                    <span class="fw-bold text-dark"
                                          th:text="${(client.firstName() != null ? client.firstName() : '') + ' ' + (client.lastName() != null ? client.lastName() : '')}">John Doe</span>
                                </div>
                            </td>

                            <td>
                                <span class="text-dark small" th:text="${client.email()}">client@example.com</span>
                            </td>

                            <td class="text-end pe-4">
                                <a th:href="@{/employee-panel/clients/{id}(id=${client.id()})}"
                                   class="btn btn-sm btn-light border rounded-pill px-3 fw-medium">
                                    <i class="ri-user-shared-line me-1"></i>
                                    <span th:text="#{employee.clients.btn.view_profile}">View Client</span>
                                </a>
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination Toolbar -->
            <div th:if="${clients != null and clients.totalPages > 1}" class="card-footer bg-white border-top p-3 d-flex justify-content-between align-items-center flex-wrap gap-2">
                <span class="small text-muted">
                    Showing page <span class="fw-bold" th:text="${clients.number + 1}">1</span> of <span class="fw-bold" th:text="${clients.totalPages}">5</span>
                </span>

                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${clients.first} ? 'disabled'">
                            <a class="page-link rounded-start-pill"
                               th:href="@{/employee-panel/clients(page=${clients.number - 1}, size=${size}, keyword=${keyword})}"
                               th:tabindex="${clients.first} ? -1 : 0"
                               th:style="${clients.first} ? 'pointer-events: none;' : ''">
                                <i class="ri-arrow-left-s-line"></i>
                            </a>
                        </li>

                        <li class="page-item" th:each="i : ${#numbers.sequence(0, clients.totalPages - 1)}"
                            th:classappend="${i == clients.number} ? 'active'">
                            <a class="page-link"
                               th:href="@{/employee-panel/clients(page=${i}, size=${size}, keyword=${keyword})}"
                               th:text="${i + 1}">1</a>
                        </li>

                        <li class="page-item" th:classappend="${clients.last} ? 'disabled'">
                            <a class="page-link rounded-end-pill"
                               th:href="@{/employee-panel/clients(page=${clients.number + 1}, size=${size}, keyword=${keyword})}"
                               th:tabindex="${clients.last} ? -1 : 0"
                               th:style="${clients.last} ? 'pointer-events: none;' : ''">
                                <i class="ri-arrow-right-s-line"></i>
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
