<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{employee.manufacturers.page_title}">Manufacturers - Employee Panel</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light">

<div class="d-flex">

    <div th:replace="~{employee-panel/employee-sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">

        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-3">
            <div>
                <h3 class="fw-bold mb-1 text-dark" th:text="#{employee.manufacturers.title}">Brand Partners</h3>
                <p class="text-muted small mb-0" th:text="#{employee.manufacturers.subtitle}">Manage partner brands and supplier list.</p>
            </div>

            <div class="d-flex align-items-center gap-3">
                <button type="button" class="btn btn-primary rounded-pill px-4 fw-medium shadow-sm d-flex align-items-center"
                        data-bs-toggle="modal" data-bs-target="#addManufacturerModal">
                    <i class="ri-add-line fs-5 me-1"></i>
                    <span th:text="#{employee.manufacturers.btn.add}">Add Manufacturer</span>
                </button>

                <div class="d-flex align-items-center bg-white px-3 py-2 rounded shadow-sm border-0">
                    <i class="ri-user-settings-line text-primary me-2 fs-5"></i>
                    <span class="text-muted fw-medium" th:text="${#authentication.name}">employee@store.com</span>
                </div>
            </div>
        </div>

        <div th:if="${errorMessage}" class="alert alert-danger border-0 rounded-4 shadow-sm d-flex align-items-center mb-4" role="alert">
            <i class="ri-error-warning-line fs-5 me-2"></i>
            <div th:text="${errorMessage}">Error occurred.</div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-3">
                <form th:action="@{/employee-panel/manufacturers}" method="get" class="row g-2 align-items-center">
                    <div class="col-md-10">
                        <div class="input-group">
                            <span class="input-group-text bg-light border-0 text-muted ps-3">
                                <i class="ri-search-line"></i>
                            </span>
                            <input type="text" name="keyword" th:value="${keyword}" class="form-control bg-light border-0 py-2"
                                   th:placeholder="#{employee.manufacturers.search_placeholder}">
                        </div>
                    </div>
                    <div class="col-md-2 d-flex gap-2">
                        <button type="submit" class="btn btn-primary w-100 rounded-pill fw-medium">
                            <span th:text="#{employee.manufacturers.btn.search}">Search</span>
                        </button>
                        <a th:if="${keyword != null and !#strings.isEmpty(keyword)}" th:href="@{/employee-panel/manufacturers}" class="btn btn-light border rounded-pill px-3">
                            <i class="ri-close-line"></i>
                        </a>
                    </div>
                </form>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-borderless align-middle mb-0">
                        <thead class="table-light text-muted small border-bottom">
                        <tr>
                            <th class="ps-4" style="width: 15%;" th:text="#{employee.manufacturers.table.id}">ID</th>
                            <th style="width: 55%;" th:text="#{employee.manufacturers.table.name}">Manufacturer Name</th>
                            <th class="text-end pe-4" style="width: 30%;" th:text="#{employee.manufacturers.table.actions}">Actions</th>
                        </tr>
                        </thead>
                        <tbody>

                        <tr th:if="${manufacturers == null or #lists.isEmpty(manufacturers)}">
                            <td colspan="3" class="text-center text-muted py-5">
                                <i class="ri-building-4-line fs-1 d-block mb-2 text-secondary opacity-50"></i>
                                <span th:text="#{employee.manufacturers.empty}">No manufacturers found.</span>
                            </td>
                        </tr>

                        <tr th:each="m : ${manufacturers}">
                            <td class="ps-4">
                                <span class="fw-bold text-primary" th:text="'#' + ${m.id()}">#1</span>
                            </td>

                            <td>
                                <div class="d-flex align-items-center">
                                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px;">
                                        <i class="ri-building-line"></i>
                                    </div>
                                    <span class="fw-bold text-dark fs-6" th:text="${m.name()}">Samsung</span>
                                </div>
                            </td>

                            <td class="text-end pe-4">
                                <div class="d-inline-flex gap-2">
                                    <!-- Edit Button -->
                                    <button type="button" class="btn btn-sm btn-light border rounded-pill px-3 fw-medium"
                                            data-bs-toggle="modal" th:data-bs-target="'#editModal-' + ${m.id()}">
                                        <i class="ri-edit-line me-1"></i> <span th:text="#{employee.manufacturers.btn.edit}">Edit</span>
                                    </button>

                                    <!-- Delete Button -->
                                    <button type="button" class="btn btn-sm btn-outline-danger rounded-pill px-3 fw-medium"
                                            data-bs-toggle="modal" th:data-bs-target="'#deleteModal-' + ${m.id()}">
                                        <i class="ri-delete-bin-line me-1"></i> <span th:text="#{employee.manufacturers.btn.delete}">Delete</span>
                                    </button>
                                </div>

                                <!-- Edit Modal -->
                                <div class="modal fade" th:id="'editModal-' + ${m.id()}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content rounded-4 border-0 shadow text-start">
                                            <div class="modal-header border-0 pb-0">
                                                <h5 class="modal-title fw-bold text-dark" th:text="#{employee.manufacturers.modal.edit_title}">Edit Manufacturer</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <form th:action="@{/employee-panel/manufacturers/{id}/edit(id=${m.id()})}" method="post">
                                                <div class="modal-body py-3">
                                                    <div class="mb-3">
                                                        <label class="form-label fw-medium text-dark" th:text="#{employee.manufacturers.form.name}">Brand Name *</label>
                                                        <input type="text" name="name" th:value="${m.name()}" class="form-control bg-light border-0 py-2" required>
                                                    </div>
                                                </div>
                                                <div class="modal-footer border-0 pt-0">
                                                    <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal" th:text="#{employee.manufacturers.modal.cancel}">Cancel</button>
                                                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-medium" th:text="#{employee.manufacturers.btn.update}">Save Changes</button>
                                                </div>
                                            </form>
                                        </div>
                                    </div>
                                </div>

                                <!-- Delete Modal -->
                                <div class="modal fade" th:id="'deleteModal-' + ${m.id()}" tabindex="-1" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog-centered">
                                        <div class="modal-content rounded-4 border-0 shadow text-start">
                                            <div class="modal-header border-0 pb-0">
                                                <h5 class="modal-title fw-bold text-dark" th:text="#{employee.manufacturers.modal.delete_title}">Confirm Deletion</h5>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body py-3">
                                                <p class="text-muted mb-1" th:text="#{employee.manufacturers.modal.delete_text}">Are you sure you want to delete this manufacturer?</p>
                                                <p class="fw-bold text-dark mb-0 fs-5" th:text="${m.name()}">Brand Name</p>
                                            </div>
                                            <div class="modal-footer border-0 pt-0">
                                                <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal" th:text="#{employee.manufacturers.modal.cancel}">Cancel</button>
                                                <form th:action="@{/employee-panel/manufacturers/{id}/delete(id=${m.id()})}" method="post" class="m-0">
                                                    <button type="submit" class="btn btn-danger rounded-pill px-3" th:text="#{employee.manufacturers.btn.delete}">Delete</button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>

                        </tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
</div>

<!-- Modal: Add Manufacturer -->
<div class="modal fade" id="addManufacturerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content rounded-4 border-0 shadow text-start">
            <div class="modal-header border-0 pb-0">
                <h5 class="modal-title fw-bold text-dark" th:text="#{employee.manufacturers.modal.add_title}">Add Manufacturer</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form th:action="@{/employee-panel/manufacturers}" method="post">
                <div class="modal-body py-3">
                    <div class="mb-3">
                        <label for="manufacturerName" class="form-label fw-medium text-dark" th:text="#{employee.manufacturers.form.name}">Brand Name *</label>
                        <input type="text" id="manufacturerName" name="name" class="form-control bg-light border-0 py-2"
                               placeholder="e.g. Philips, LG, Bosch" required autofocus>
                    </div>
                </div>
                <div class="modal-footer border-0 pt-0">
                    <button type="button" class="btn btn-light rounded-pill px-3" data-bs-dismiss="modal" th:text="#{employee.manufacturers.modal.cancel}">Cancel</button>
                    <button type="submit" class="btn btn-primary rounded-pill px-4 fw-medium" th:text="#{employee.manufacturers.btn.save}">Save Brand</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
