<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${employee.id == null} ? #{admin.employees.form.title_add} : #{admin.employees.form.title_edit}">Edit Employee - Admin Panel</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">

        <div class="mb-4">
            <a th:href="@{/admin/users/employees}" class="text-decoration-none text-muted small">
                <i class="ri-arrow-left-line"></i> <span th:text="#{admin.employees.form.back}">Back to Employees</span>
            </a>
            <h3 class="fw-bold mb-0 text-dark mt-1"
                th:text="${employee.id == null} ? #{admin.employees.form.title_add} : #{admin.employees.form.title_edit}">
                Add/Edit Employee
            </h3>
        </div>

        <!-- Cart For Save -->
        <div class="card border-0 shadow-sm rounded-4" style="max-width: 900px;">
            <div class="card-body p-4 p-md-5">

                <form th:action="@{/admin/users/employees/save}" th:object="${employee}" method="post">

                    <input type="hidden" th:field="*{id}" />

                    <div class="row g-4">

                        <!-- First Name, Last Name, Middle Name -->
                        <div class="col-md-4">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.users.form.lastName}">Last Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-light border-0" th:field="*{lastName}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.users.form.firstName}">First Name <span class="text-danger">*</span></label>
                            <input type="text" class="form-control bg-light border-0" th:field="*{firstName}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.users.form.middleName}">Middle Name</label>
                            <input type="text" class="form-control bg-light border-0" th:field="*{middleName}">
                        </div>

                        <!-- Email & Password -->
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.users.form.email}">Email <span class="text-danger">*</span></label>
                            <input type="email" class="form-control bg-light border-0" th:field="*{email}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.users.form.password}">Password</label>
                            <input type="password" name="password" class="form-control bg-light border-0"
                                   th:placeholder="${employee.id == null} ? 'Enter new password' : 'Leave blank to keep current'">
                        </div>

                        <!-- Birthday -->
                        <div class="col-12">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.users.form.birthday}">Birthday <span class="text-danger">*</span></label>
                            <input type="date" class="form-control bg-light border-0" th:field="*{birthday}">
                        </div>

                        <!-- Department & Role -->
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.users.form.department}">Department</label>
                            <input type="text" class="form-control bg-light border-0" th:field="*{department}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.users.form.role}">Role</label>
                            <select class="form-select bg-light border-0" th:field="*{role}" required>
                                <option value="ROLE_EMPLOYEE">Employee</option>
                                <option value="ROLE_ADMIN">Administrator</option>
                            </select>
                        </div>

                        <!-- State -->
                        <div class="col-12 mt-4 pt-3 border-top">
                            <div class="form-check form-switch fs-5">
                                <input class="form-check-input" type="checkbox" th:field="*{enabled}" id="enabledSwitch">
                                <label class="form-check-label fw-medium ms-2" for="enabledSwitch" th:text="#{admin.users.form.enabled}">Account is Active</label>
                            </div>
                            <div class="form-text ms-5" th:text="#{admin.users.form.enabled_hint}">If disabled, the user will not be able to log in.</div>
                        </div>

                        <!-- Control Button -->
                        <div class="col-12 mt-5">
                            <button type="submit" class="btn btn-info text-white px-5 rounded-pill shadow-sm fw-medium">
                                <i class="ri-save-line me-1"></i> <span th:text="#{admin.users.form.save_btn}">Save Employee</span>
                            </button>
                            <a th:href="@{/admin/users/employees}" class="btn btn-light border px-4 rounded-pill ms-2 fw-medium">
                                <span th:text="#{admin.users.form.cancel_btn}">Cancel</span>
                            </a>
                        </div>

                    </div>
                </form>

            </div>
        </div>

    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
