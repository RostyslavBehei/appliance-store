<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{admin.clients.page_title}">Clients - Admin Panel</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">

    <style>
        .search-icon { position: absolute; top: 50%; left: 15px; transform: translateY(-50%); color: #6c757d; }
        .search-input { padding-left: 40px; border-radius: 8px; }
    </style>
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <a th:href="@{/admin/users}" class="text-decoration-none text-muted small">
                    <i class="ri-arrow-left-line"></i> <span th:text="#{admin.clients.back_to_users}">Back to Users</span>
                </a>
                <h3 class="fw-bold mb-0 text-dark mt-1" th:text="#{admin.clients.title}">Clients Management</h3>
            </div>

            <div class="d-flex align-items-center bg-white px-3 py-2 rounded shadow-sm border-0">
                <i class="ri-admin-line text-primary me-2 fs-5"></i>
                <span class="text-muted fw-medium me-3" th:text="${#authentication.name}">admin@store.com</span>
            </div>
        </div>

        <!-- Clients Table Card -->
        <div class="card border-0 shadow-sm rounded-4">

            <!-- Filter & Search Toolbar -->
            <div class="card-header bg-white border-bottom pt-4 pb-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <form th:action="@{/admin/users/clients}" method="get" class="row g-2 align-items-center flex-grow-1 m-0">
                    <!-- Search Input -->
                    <div class="col-md-6 position-relative">
                        <i class="ri-search-line search-icon"></i>
                        <input type="text" name="keyword" class="form-control search-input bg-light border-0"
                               th:placeholder="#{admin.clients.search_placeholder}" placeholder="Search clients by name..." th:value="${keyword}">
                    </div>

                    <!-- Sort -->
                    <div class="col-md-4">
                        <select name="sort" class="form-select bg-light border-0">
                            <option value="newest" th:selected="${sort == 'newest'}" th:text="#{admin.clients.sort.newest}">Newest First</option>
                            <option value="oldest" th:selected="${sort == 'oldest'}" th:text="#{admin.clients.sort.oldest}">Oldest First</option>
                            <option value="nameAsc" th:selected="${sort == 'nameAsc'}" th:text="#{admin.clients.sort.name_asc}">Name (A-Z)</option>
                        </select>
                    </div>

                    <!-- Submit Button -->
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100 rounded-3">
                            <i class="ri-search-line me-1"></i> <span th:text="#{admin.clients.search_btn}">Search</span>
                        </button>
                    </div>
                </form>

                <div>
                    <a th:href="@{/admin/users/clients/new}" class="btn btn-success text-white rounded-3 shadow-sm text-nowrap">
                        <i class="ri-add-line me-1"></i> <span th:text="#{admin.clients.add_btn}">Add Client</span>
                    </a>
                </div>
            </div>

            <!-- Table Data -->
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-borderless align-middle mb-0">
                        <thead class="table-light text-muted small">
                        <tr>
                            <th class="ps-4" th:text="#{admin.users.table.fullname}">Full Name</th>
                            <th th:text="#{admin.users.table.birthday}">Birthday</th>
                            <th th:text="#{admin.users.table.cart}">Email / Cart</th>
                            <th th:text="#{admin.users.table.status}">Status</th>
                            <th class="text-end pe-4" th:text="#{admin.clients.table.actions}">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Empty State -->
                        <tr th:if="${clientsPage.empty}">
                            <td colspan="5" class="text-center text-muted py-5">
                                <i class="ri-user-search-line fs-1 d-block mb-2 opacity-50"></i>
                                <span th:text="#{admin.clients.no_found}">No clients found matching your criteria.</span>
                            </td>
                        </tr>

                        <!-- Rows -->
                        <tr th:each="client : ${clientsPage.content}">
                            <td class="ps-4 fw-medium text-dark">
                                <div class="d-flex align-items-center">
                                    <div class="avatar-initial bg-primary bg-opacity-10 text-primary rounded-circle d-flex align-items-center justify-content-center me-3" style="width: 40px; height: 40px; font-weight: bold;">
                                        <span th:text="${#strings.substring(client.firstName,0,1) + #strings.substring(client.lastName,0,1)}">JD</span>
                                    </div>
                                    <span th:text="${client.firstName + ' ' + client.lastName}">John Doe</span>
                                </div>
                            </td>
                            <td><span class="text-muted small" th:text="${#temporals.format(client.birthday, 'dd MMM yyyy')}">10 Apr 1990</span></td>
                            <td>
                                <!-- Show Email & Department -->
                                <div class="small fw-medium" th:text="${client.email}">user@email.com</div>
                                <span class="badge bg-light text-dark border mt-1" th:text="${client.cart}">5326-1111</span>
                            </td>
                            <td>
                                <span class="badge rounded-pill"
                                      th:classappend="${client.enabled} ? 'bg-success bg-opacity-10 text-success' : 'bg-danger bg-opacity-10 text-danger'"
                                      th:text="${client.enabled} ? #{admin.users.status.active} : #{admin.users.status.disabled}">Active</span>
                            </td>

                            <!-- Actions Buttons -->
                            <td class="text-end pe-4">
                                <div class="d-flex justify-content-end gap-2">
                                    <!-- Edit -->
                                    <a th:href="@{/admin/users/clients/edit/{id}(id=${client.id})}" class="btn btn-sm btn-outline-primary" th:title="#{admin.clients.action.edit}">
                                        <i class="ri-pencil-line"></i>
                                    </a>

                                    <!-- Delete -->
                                    <form th:action="@{/admin/users/delete/{id}(id=${client.id})}" method="post"
                                          th:onsubmit="'return confirm(\'' + #{admin.clients.action.delete_confirm} + '\');'">
                                        <button type="submit" class="btn btn-sm btn-outline-danger" th:title="#{admin.clients.action.delete}">
                                            <i class="ri-delete-bin-line"></i>
                                        </button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div class="card-footer bg-white border-top py-3 px-4 d-flex justify-content-between align-items-center" th:if="${!clientsPage.empty}">
                <span class="text-muted small" th:text="#{admin.clients.pagination.showing(${clientsPage.number + 1}, ${clientsPage.totalPages})}">Showing page 1 of 5</span>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${clientsPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/users/clients(page=${clientsPage.number - 1}, keyword=${keyword}, sort=${sort})}"><i class="ri-arrow-left-s-line"></i></a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, clientsPage.totalPages - 1)}" th:classappend="${clientsPage.number == i} ? 'active'">
                            <a class="page-link" th:href="@{/admin/users/clients(page=${i}, keyword=${keyword}, sort=${sort})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${clientsPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/users/clients(page=${clientsPage.number + 1}, keyword=${keyword}, sort=${sort})}"><i class="ri-arrow-right-s-line"></i></a>
                        </li>
                    </ul>
                </nav>
            </div>
        </div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
