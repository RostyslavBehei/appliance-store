<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.appliances.details.page_title} + ' #' + ${appliance.id}">Appliance Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">

        <div class="mb-4">
            <a th:href="@{/admin/appliances}" class="text-decoration-none text-muted small">
                <i class="ri-arrow-left-line"></i> <span th:text="#{admin.appliances.back}">Back to Appliances</span>
            </a>
            <h3 class="fw-bold mb-0 text-dark mt-1">
                <span th:text="#{admin.appliances.details.title}">Appliance</span> <span class="text-primary" th:text="'#' + ${appliance.id}">#1</span>
            </h3>
        </div>

        <div class="card border-0 shadow-sm rounded-4" style="max-width: 800px;">
            <div class="card-header bg-white border-bottom pt-4 pb-3 px-4 d-flex justify-content-between align-items-center">
                <h5 class="mb-0 fw-bold text-dark" th:text="${appliance.manufacturerName + ' ' + appliance.name}">Samsung Washer</h5>
                <a th:href="@{/admin/appliances/edit/{id}(id=${appliance.id})}" class="btn btn-sm btn-outline-primary">
                    <i class="ri-pencil-line me-1"></i> <span th:text="#{admin.btn.edit}">Edit</span>
                </a>
            </div>

            <div class="card-body p-4">
                <div class="row g-4">
                    <div class="col-sm-6">
                        <label class="text-muted small fw-bold text-uppercase" th:text="#{admin.appliances.form.model}">Model</label>
                        <p class="fs-5 fw-medium text-dark mb-0" th:text="${appliance.model}">X123</p>
                    </div>
                    <div class="col-sm-6">
                        <label class="text-muted small fw-bold text-uppercase" th:text="#{admin.appliances.form.price}">Price</label>
                        <p class="fs-5 fw-bold text-primary mb-0" th:text="${appliance.price + ' ₴'}">15000.00 ₴</p>
                    </div>

                    <div class="col-sm-4">
                        <label class="text-muted small fw-bold text-uppercase" th:text="#{admin.appliances.form.category}">Category</label>
                        <p class="fw-medium text-dark mb-0"><span class="badge bg-light text-dark border px-2 py-1" th:text="${appliance.category}">BIG</span></p>
                    </div>
                    <div class="col-sm-4">
                        <label class="text-muted small fw-bold text-uppercase" th:text="#{admin.appliances.form.power}">Power</label>
                        <p class="fw-medium text-dark mb-0" th:text="${appliance.power + ' W'}">1500 W</p>
                    </div>
                    <div class="col-sm-4">
                        <label class="text-muted small fw-bold text-uppercase" th:text="#{admin.appliances.form.power_type}">Power Type</label>
                        <p class="fw-medium text-dark mb-0" th:text="${appliance.powerType}">AC220</p>
                    </div>

                    <div class="col-12 border-top pt-3">
                        <label class="text-muted small fw-bold text-uppercase" th:text="#{admin.appliances.form.characteristic}">Characteristics</label>
                        <p class="fw-medium text-dark mb-0" th:text="${appliance.characteristic}">Capacity 8kg</p>
                    </div>
                    <div class="col-12 mt-3">
                        <label class="text-muted small fw-bold text-uppercase" th:text="#{admin.appliances.form.description}">Description</label>
                        <p class="text-dark mb-0" style="white-space: pre-wrap;" th:text="${appliance.description}">Detailed description here...</p>
                    </div>
                </div>
            </div>
        </div>

    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
