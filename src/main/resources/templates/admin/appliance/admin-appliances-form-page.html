<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${appliance.id == null} ? #{admin.appliances.form.title_add} : #{admin.appliances.form.title_edit}">Form - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">

        <div class="mb-4">
            <a th:href="@{/admin/appliances}" class="text-decoration-none text-muted small">
                <i class="ri-arrow-left-line"></i> <span th:text="#{admin.appliances.back}">Back to Appliances</span>
            </a>
            <h3 class="fw-bold mb-0 text-dark mt-1"
                th:text="${appliance.id == null} ? #{admin.appliances.form.title_add} : #{admin.appliances.form.title_edit}">
                Add/Edit Appliance
            </h3>
        </div>

        <div class="card border-0 shadow-sm rounded-4" style="max-width: 900px;">
            <div class="card-body p-4 p-md-5">

                <form th:action="@{/admin/appliances/save}" method="post">

                    <input type="hidden" name="id" th:value="${appliance.id}" />

                    <div class="row g-4">
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.appliances.form.name}">Product Name <span class="text-danger">*</span></label>
                            <input type="text" name="name" class="form-control bg-light border-0" th:value="${appliance.name}" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.appliances.form.model}">Model <span class="text-danger">*</span></label>
                            <input type="text" name="model" class="form-control bg-light border-0" th:value="${appliance.model}" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.appliances.form.category}">Category <span class="text-danger">*</span></label>
                            <select name="category" class="form-select bg-light border-0" required>
                                <option value="" disabled th:selected="${appliance.category == null}">-- Select Category --</option>
                                <option th:each="cat : ${categories}" th:value="${cat}" th:text="${cat}" th:selected="${cat.name() == appliance.category}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.appliances.form.manufacturer}">Manufacturer <span class="text-danger">*</span></label>
                            <select name="manufacturerId" class="form-select bg-light border-0" required>
                                <option value="" disabled th:selected="${appliance.manufacturerName == null}">-- Select Manufacturer --</option>
                                <option th:each="man : ${manufacturers}" th:value="${man.id}" th:text="${man.name}" th:selected="${man.name == appliance.manufacturerName}"></option>
                            </select>
                        </div>

                        <div class="col-md-4">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.appliances.form.price}">Price ($) <span class="text-danger">*</span></label>
                            <input type="number" step="0.01" min="0" name="price" class="form-control bg-light border-0" th:value="${appliance.price}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.appliances.form.power}">Power (W) <span class="text-danger">*</span></label>
                            <input type="number" min="0" name="power" class="form-control bg-light border-0" th:value="${appliance.power}" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.appliances.form.power_type}">Power Type <span class="text-danger">*</span></label>
                            <select name="powerType" class="form-select bg-light border-0" required>
                                <option value="" disabled th:selected="${appliance.powerType == null}">-- Select Type --</option>
                                <option th:each="pt : ${powerType}" th:value="${pt}" th:text="${pt}" th:selected="${pt.name() == appliance.powerType}"></option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.appliances.form.characteristic}">Key Characteristic <span class="text-danger">*</span></label>
                            <input type="text" name="characteristic" class="form-control bg-light border-0" th:value="${appliance.characteristic}" required>
                        </div>
                        <div class="col-12">
                            <label class="form-label fw-medium text-dark" th:text="#{admin.appliances.form.description}">Description</label>
                            <textarea name="description" class="form-control bg-light border-0" rows="4" th:text="${appliance.description}"></textarea>
                        </div>

                        <div class="col-12 mt-4 pt-3 border-top">
                            <button type="submit" class="btn btn-primary px-5 rounded-pill shadow-sm fw-medium">
                                <i class="ri-save-line me-1"></i> <span th:text="#{admin.btn.save}">Save Appliance</span>
                            </button>
                            <a th:href="@{/admin/appliances}" class="btn btn-light border px-4 rounded-pill ms-2 fw-medium">
                                <span th:text="#{admin.btn.cancel}">Cancel</span>
                            </a>
                        </div>
                    </div>
                </form>

            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
