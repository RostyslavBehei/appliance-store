<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.manufacturers.page_title}">Manufacturers - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">

<div class="d-flex">
    <!-- Sidebar -->
    <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0 text-dark" th:text="#{admin.manufacturers.title}">Manufacturers Management</h3>
            <div class="d-flex align-items-center bg-white px-3 py-2 rounded shadow-sm border-0">
                <i class="ri-admin-line text-primary me-2 fs-5"></i>
                <span class="text-muted fw-medium me-3" th:text="${#authentication.name}">admin</span>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4">

            <!-- Search & Add New -->
            <div class="card-header bg-white border-bottom pt-4 pb-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <form th:action="@{/admin/manufacturers}" method="get" class="row g-2 align-items-center flex-grow-1 m-0">
                    <div class="col-md-8 position-relative">
                        <i class="ri-search-line position-absolute top-50 translate-middle-y text-muted ms-3"></i>
                        <input type="text" name="keyword" class="form-control bg-light border-0 ps-5"
                               th:placeholder="#{admin.manufacturers.search}" th:value="${keyword}">
                    </div>
                    <div class="col-md-3">
                        <button type="submit" class="btn btn-primary w-100 rounded-3">
                            <i class="ri-search-line me-1"></i> <span th:text="#{admin.btn.search}">Search</span>
                        </button>
                    </div>
                </form>

                <div>
                    <a th:href="@{/admin/manufacturers/new}" class="btn btn-success text-white rounded-3 shadow-sm text-nowrap">
                        <i class="ri-add-line me-1"></i> <span th:text="#{admin.manufacturers.add_btn}">Add Manufacturer</span>
                    </a>
                </div>
            </div>

            <!-- Table -->
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-borderless align-middle mb-0">
                        <thead class="table-light text-muted small">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th th:text="#{admin.manufacturers.table.name}">Manufacturer Name</th>
                            <th th:text="#{admin.manufacturers.table.created}">Registered Date</th>
                            <th class="text-end pe-4" th:text="#{admin.table.actions}">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <!-- Якщо список пустий -->
                        <tr th:if="${manufacturersList.empty}">
                            <td colspan="4" class="text-center text-muted py-5">
                                <i class="ri-building-line fs-1 d-block mb-2 opacity-50"></i>
                                <span th:text="#{admin.manufacturers.no_found}">No manufacturers found.</span>
                            </td>
                        </tr>
                        <!-- Рядки -->
                        <tr th:each="man : ${manufacturersList}">
                            <td class="ps-4 fw-medium text-muted" th:text="'#' + ${man.id}">#1</td>
                            <td class="fw-bold text-dark" th:text="${man.name}">Samsung</td>
                            <td><span class="text-muted small" th:text="${#temporals.format(man.createdAt, 'dd MMM yyyy, HH:mm')}">10 Apr 2026</span></td>
                            <td class="text-end pe-4">
                                <div class="d-flex justify-content-end gap-2">
                                    <!-- Edit -->
                                    <a th:href="@{/admin/manufacturers/edit/{id}(id=${man.id})}" class="btn btn-sm btn-outline-primary">
                                        <i class="ri-pencil-line"></i>
                                    </a>
                                    <!-- Delete -->
                                    <form th:action="@{/admin/manufacturers/delete/{id}(id=${man.id})}" method="post"
                                          th:onsubmit="'return confirm(\'' + #{admin.manufacturers.delete_confirm} + '\');'">
                                        <button type="submit" class="btn btn-sm btn-outline-danger"><i class="ri-delete-bin-line"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
