<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.orders.page_title}">Orders - Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">

        <div class="d-flex justify-content-between align-items-center mb-4">
            <h3 class="fw-bold mb-0 text-dark" th:text="#{admin.orders.title}">Orders Management</h3>
            <div class="d-flex align-items-center bg-white px-3 py-2 rounded shadow-sm border-0">
                <i class="ri-admin-line text-primary me-2 fs-5"></i>
                <span class="text-muted fw-medium me-3" th:text="${#authentication.name}">admin</span>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4">

            <!-- Search & Filter -->
            <div class="card-header bg-white border-bottom pt-4 pb-3 px-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
                <form th:action="@{/admin/orders}" method="get" class="row g-2 align-items-center flex-grow-1 m-0">
                    <div class="col-md-6 position-relative">
                        <i class="ri-search-line position-absolute top-50 translate-middle-y text-muted ms-3"></i>
                        <input type="text" name="keyword" class="form-control bg-light border-0 ps-5"
                               th:placeholder="#{admin.orders.search}" th:value="${keyword}">
                    </div>
                    <div class="col-md-4">
                        <select name="sort" class="form-select bg-light border-0">
                            <option value="newest" th:selected="${sort == 'newest'}" th:text="#{admin.sort.newest}">Newest First</option>
                            <option value="oldest" th:selected="${sort == 'oldest'}" th:text="#{admin.sort.oldest}">Oldest First</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <button type="submit" class="btn btn-primary w-100 rounded-3">
                            <i class="ri-search-line me-1"></i> <span th:text="#{admin.btn.search}">Search</span>
                        </button>
                    </div>
                </form>
            </div>

            <!-- Table -->
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover table-borderless align-middle mb-0">
                        <thead class="table-light text-muted small">
                        <tr>
                            <th class="ps-4">ID</th>
                            <th th:text="#{admin.orders.table.client}">Client ID</th>
                            <th th:text="#{admin.orders.table.date}">Date</th>
                            <th th:text="#{admin.orders.table.amount}">Amount</th>
                            <th th:text="#{admin.orders.table.status}">Status</th>
                            <th class="text-end pe-4" th:text="#{admin.table.actions}">Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:if="${ordersPage.empty}">
                            <td colspan="6" class="text-center text-muted py-5">
                                <i class="ri-inbox-line fs-1 d-block mb-2 opacity-50"></i>
                                <span th:text="#{admin.orders.no_found}">No orders found.</span>
                            </td>
                        </tr>

                        <tr th:each="order : ${ordersPage.content}">
                            <td class="ps-4 fw-bold text-dark" th:text="'#' + ${order.id}">#1024</td>
                            <td class="text-muted" th:text="'User #' + ${order.userId}">User #5</td>
                            <td><span class="text-muted small" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}">10 Apr 2026</span></td>
                            <td class="fw-medium text-dark" th:text="${order.amount + ' ₴'}">15000.00 ₴</td>
                            <td>
                                <!-- Status -->
                                <span class="badge rounded-pill"
                                      th:classappend="${order.status} ? 'bg-success bg-opacity-10 text-success border border-success-subtle' : 'bg-warning bg-opacity-10 text-warning border border-warning-subtle'"
                                      th:text="${order.status} ? #{admin.orders.status.approved} : #{admin.orders.status.pending}">
                                    Pending
                                </span>
                            </td>
                            <td class="text-end pe-4">
                                <a th:href="@{/admin/orders/{id}(id=${order.id})}" class="btn btn-sm btn-outline-primary" th:title="#{admin.orders.btn.view}">
                                    <i class="ri-eye-line"></i> <span th:text="#{admin.orders.btn.view}">View</span>
                                </a>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Pagination -->
            <div class="card-footer bg-white border-top py-3 px-4 d-flex justify-content-between align-items-center" th:if="${!ordersPage.empty}">
                <span class="text-muted small" th:text="#{admin.pagination.showing(${ordersPage.number + 1}, ${ordersPage.totalPages})}">Showing page 1 of 5</span>
                <nav>
                    <ul class="pagination pagination-sm mb-0">
                        <li class="page-item" th:classappend="${ordersPage.first} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/orders(page=${ordersPage.number - 1}, keyword=${keyword}, sort=${sort})}"><i class="ri-arrow-left-s-line"></i></a>
                        </li>
                        <li class="page-item" th:each="i : ${#numbers.sequence(0, ordersPage.totalPages - 1)}" th:classappend="${ordersPage.number == i} ? 'active'">
                            <a class="page-link" th:href="@{/admin/orders(page=${i}, keyword=${keyword}, sort=${sort})}" th:text="${i + 1}">1</a>
                        </li>
                        <li class="page-item" th:classappend="${ordersPage.last} ? 'disabled'">
                            <a class="page-link" th:href="@{/admin/orders(page=${ordersPage.number + 1}, keyword=${keyword}, sort=${sort})}"><i class="ri-arrow-right-s-line"></i></a>
                        </li>
                    </ul>
                </nav>
            </div>

        </div>
    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
