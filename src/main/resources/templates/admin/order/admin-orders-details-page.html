<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="#{admin.orders.details.page_title} + ' #' + ${order.id}">Order Details - Admin Panel</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light">

<div class="d-flex">
    <div th:replace="~{admin/admin-sidebar :: sidebar}"></div>

    <main class="flex-grow-1 p-4" style="height: 100vh; overflow-y: auto;">

        <div class="mb-4 d-flex justify-content-between align-items-center flex-wrap gap-3">
            <div>
                <a th:href="@{/admin/orders}" class="text-decoration-none text-muted small">
                    <i class="ri-arrow-left-line"></i> <span th:text="#{admin.orders.btn.back}">Back to Orders</span>
                </a>
                <h3 class="fw-bold mb-0 text-dark mt-1">
                    <span th:text="#{admin.orders.details.title}">Order</span> <span class="text-primary" th:text="'#' + ${order.id}">#1024</span>
                </h3>
            </div>

            <form th:if="${!order.approved}" th:action="@{/admin/orders/{id}/approve(id=${order.id})}" method="post" class="m-0">
                <button type="submit" class="btn btn-success px-4 rounded-pill shadow-sm fw-medium">
                    <i class="ri-check-double-line me-1"></i> <span th:text="#{admin.orders.btn.approve}">Approve Order</span>
                </button>
            </form>
        </div>

        <div class="row g-4">
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm rounded-4 position-sticky" style="top: 20px;">
                    <div class="card-body p-4">
                        <h5 class="fw-bold text-dark border-bottom pb-3 mb-4"><i class="ri-file-list-3-line text-primary me-2"></i><span th:text="#{admin.orders.details.summary}">Order Summary</span></h5>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted fw-medium" th:text="#{admin.orders.table.status}">Status</span>
                            <span class="badge rounded-pill"
                                  th:classappend="${order.approved} ? 'bg-success bg-opacity-10 text-success border border-success-subtle' : 'bg-warning bg-opacity-10 text-warning border border-warning-subtle'"
                                  th:text="${order.approved} ? #{admin.orders.status.approved} : #{admin.orders.status.pending}">
                            </span>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted fw-medium" th:text="#{admin.orders.table.date}">Created At</span>
                            <span class="fw-medium text-dark text-end" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}">10 Apr 2026</span>
                        </div>

                        <div class="d-flex justify-content-between mb-4 pb-3 border-bottom">
                            <span class="text-muted fw-medium" th:text="#{admin.orders.details.updated}">Last Updated</span>
                            <span class="fw-medium text-dark text-end" th:text="${order.updatedAt != null ? #temporals.format(order.updatedAt, 'dd MMM yyyy, HH:mm') : '-'}">-</span>
                        </div>

                        <div class="d-flex justify-content-between align-items-center bg-light p-3 rounded-3">
                            <span class="fs-6 text-muted fw-bold text-uppercase" th:text="#{admin.orders.details.total}">Total</span>
                            <span class="fs-4 fw-bold text-primary" th:text="${order.totalPrice + ' ₴'}">15000.00 ₴</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 shadow-sm rounded-4 h-100">
                    <div class="card-header bg-white border-bottom pt-4 pb-3 px-4">
                        <h5 class="mb-0 fw-bold text-dark"><i class="ri-shopping-cart-2-line text-primary me-2"></i><span th:text="#{admin.orders.details.items}">Items in Order</span></h5>
                    </div>

                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover table-borderless align-middle mb-0">
                                <thead class="table-light text-muted small">
                                <tr>
                                    <th class="ps-4" th:text="#{admin.orders.items.product}">Product</th>
                                    <th th:text="#{admin.orders.items.qty}">Qty</th>
                                    <th th:text="#{admin.orders.items.price}">Unit Price</th>
                                    <th class="text-end pe-4" th:text="#{admin.orders.items.total}">Row Total</th>
                                </tr>
                                </thead>
                                <tbody>

                                <tr th:each="row : ${order.orderRowResponses}">

                                    <td class="ps-4">
                                        <div class="fw-bold text-dark mb-1" th:text="${row.appliance.manufacturerName + ' ' + row.appliance.name}">Samsung Washer</div>
                                        <div class="small text-muted d-flex gap-2 align-items-center">
                                            <span class="badge bg-light text-dark border" th:text="${row.appliance.category}">BIG</span>
                                            <span th:text="'Model: ' + ${row.appliance.model}">Model: X123</span>
                                        </div>
                                    </td>

                                    <td>
                                        <span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle px-2 py-1 fs-6" th:text="${row.number}">1</span>
                                    </td>

                                    <td class="text-muted fw-medium" th:text="${row.appliance.price + ' ₴'}">15000.00 ₴</td>

                                    <td class="text-end pe-4 fw-bold text-dark" th:text="${row.amount + ' ₴'}">15000.00 ₴</td>
                                </tr>

                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>

        </div>

    </main>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
