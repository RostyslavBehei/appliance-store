<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{header.button.cart}">My Cart - Appliance Store</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<header th:insert="~{header::navy}"></header>

<main class="flex-grow-1 py-5">
    <div class="container">
        <h2 class="fw-bold mb-4" th:text="#{cart.title.text}">My Cart</h2>

        <div th:if="${carts == null or carts.isEmpty() or totalItems == 0}" class="text-center py-5 bg-white rounded shadow-sm border">
            <i class="ri-shopping-cart-2-line text-secondary mb-3" style="font-size: 4rem;"></i>
            <h3 class="text-dark fw-bold" th:text="#{cart.cartItem.isEmpty}">Your cart is empty</h3>
            <p class="text-muted" th:text="#{cart.cartItem.isEmpty.description}">Looks like you haven't added anything yet.</p>
            <a href="/" class="btn btn-primary rounded-pill mt-3 px-4">
                <i class="ri-arrow-left-line me-1"></i>
                <span th:text="#{cart.cartItem.isEmpty.button.back}">Go to catalog</span>
            </a>
        </div>

        <div th:if="${carts != null and !carts.isEmpty() and totalItems > 0}" class="row g-4">

            <div class="col-lg-8">

                <th:block th:each="cart : ${carts}">

                    <div class="card border-0 rounded shadow-sm mb-3 appliance-card" th:each="item : ${cart.cartItems}">
                        <div class="card-body p-4 d-flex align-items-center">

                            <!-- Photo -->
                            <div class="bg-secondary bg-opacity-10 rounded d-flex align-items-center justify-content-center me-4" style="width: 90px; height: 90px;">
                                <i class="ri-macbook-line text-secondary" style="font-size: 2.5rem;"></i>
                            </div>

                            <div class="flex-grow-1">
                                <span class="badge bg-primary bg-opacity-10 text-primary border border-primary-subtle rounded-pill mb-2 px-2"
                                      th:text="${item.appliance.manufacturerName}">Brand</span>
                                <h5 class="fw-bold mb-1">
                                    <a th:href="@{/appliances/{id}(id=${item.appliance.id})}" class="text-dark text-decoration-none" th:text="${item.appliance.name}">Appliance Name</a>
                                </h5>

                                <p class="text-muted small mb-2">
                                    Price: <span class="fw-medium text-dark" th:text="${#numbers.formatDecimal(item.appliance.price, 1, 2)}">0.00</span> $
                                </p>

                                <!-- Form to Update Quantity -->
                                <form th:action="@{/cart/update}" method="post" class="d-flex align-items-center gap-2 mt-2">
                                    <input type="hidden" name="cartItemId" th:value="${item.id}">

                                    <div class="input-group input-group-sm" style="width: 110px;">
                                        <button class="btn btn-outline-secondary" type="button" onclick="this.nextElementSibling.stepDown()">-</button>
                                        <input type="number" class="form-control text-center" name="quantity" th:value="${item.quantity}" min="1" max="99">
                                        <button class="btn btn-outline-secondary" type="button" onclick="this.previousElementSibling.stepUp()">+</button>
                                    </div>

                                    <button type="submit" class="btn btn-sm btn-outline-primary" title="Update quantity">
                                        <i class="ri-refresh-line"></i>
                                    </button>
                                </form>
                            </div>

                            <!-- Total Sum & Remove Button -->
                            <div class="text-end ms-4 d-flex flex-column justify-content-between h-100">
                                <h4 class="fw-bold text-dark mb-3">
                                    <span th:text="${#numbers.formatDecimal(item.sum, 1, 2)}">0.00</span> $
                                </h4>

                                <form th:action="@{/cart/remove}" method="post" class="mt-auto">
                                    <input type="hidden" name="cartItemId" th:value="${item.id}">
                                    <button type="submit" class="btn btn-sm btn-outline-danger border-0 d-inline-flex align-items-center">
                                        <i class="ri-delete-bin-line me-1"></i>
                                        <span th:text="#{cart.cartItem.remove}">Remove</span>
                                    </button>
                                </form>
                            </div>

                        </div>
                    </div>
                </th:block>

            </div>

            <!-- Order Summary -->
            <div class="col-lg-4">
                <div class="card border-0 rounded shadow-sm sticky-top" style="top: 2rem;">
                    <div class="card-body p-4">
                        <h4 class="fw-bold mb-4" th:text="#{cart.order.summary}">Order Summary</h4>

                        <div class="d-flex justify-content-between mb-3 text-muted">
                            <span>Products:</span>
                            <span class="fw-medium">
                                <span th:text="${totalItems}">0</span>
                                <span th:text="#{cart.order.items}">items</span>
                            </span>
                        </div>

                        <div class="d-flex justify-content-between mb-3">
                            <span class="text-muted" th:text="#{cart.order.total-sum}">Total sum:</span>
                            <span class="fw-bold fs-4 text-primary"><span th:text="${#numbers.formatDecimal(totalSum, 1, 2)}">0.00</span> $</span>
                        </div>

                        <hr class="my-4">

                        <form th:action="@{/orders/checkout}" method="get">
                            <button type="submit" class="btn btn-primary btn-lg w-100 rounded-pill fw-bold shadow-sm">
                                <span th:text="#{cart.order.checkout.proceed}">Proceed to Checkout</span> <i class="ri-arrow-right-line ms-1"></i>
                            </button>
                        </form>

                        <a href="/" class="btn btn-link w-100 text-decoration-none mt-2 text-muted">
                            <span th:text="#{cart.order.continue.shopping}">Continue shopping</span>
                        </a>
                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
