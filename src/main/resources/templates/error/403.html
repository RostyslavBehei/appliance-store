<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error - Appliance Store</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <!-- Іконка (Для 404 - text-warning, для 500 - text-danger) -->
            <i class="ri-error-warning-fill text-warning" style="font-size: 6rem;"></i>

            <!-- Код помилки -->
            <h1 class="display-1 fw-bold text-dark mt-3 mb-0" th:text="${status} ?: '404'">404</h1>

            <!-- Заголовок -->
            <h3 class="fw-bold text-dark mb-4" th:text="${error} ?: 'Page Not Found'">Page Not Found</h3>

            <!-- Текст помилки (підхоплює model.addObject("message", ex.getMessage())) -->
            <p class="text-muted fs-5 mb-5" th:text="${message} ?: 'The requested resource could not be found.'">
                Detailed error message goes here.
            </p>

            <!-- Кнопки навігації -->
            <div class="d-flex justify-content-center gap-3">
                <button onclick="history.back()" class="btn btn-light border px-4 py-2 rounded-pill fw-medium">
                    <i class="ri-arrow-left-line me-1"></i> Go Back
                </button>
                <a th:href="@{/}" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm fw-medium">
                    <i class="ri-home-4-line me-1"></i> Go to Homepage
                </a>
            </div>

        </div>
    </div>
</div>

</body>
</html>
