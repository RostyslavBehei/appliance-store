<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found - Appliance Store</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <i class="ri-search-eye-line text-warning" style="font-size: 6rem;"></i>

            <h1 class="display-1 fw-bold text-dark mt-3 mb-0">404</h1>
            <h3 class="fw-bold text-dark mb-4">Page Not Found</h3>

            <p class="text-muted fs-5 mb-5" th:text="${message} ?: 'The page or resource you are looking for does not exist or has been moved.'">
                The page or resource you are looking for does not exist or has been moved.
            </p>

            <div class="d-flex justify-content-center gap-3">
                <button onclick="history.back()" class="btn btn-light border px-4 py-2 rounded-pill fw-medium shadow-sm">
                    <i class="ri-arrow-left-line me-1"></i> Go Back
                </button>
                <a th:href="@{/}" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm fw-medium">
                    <i class="ri-home-4-line me-1"></i> Go to Homepage
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
