<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 Internal Server Error - Appliance Store</title>

    <!-- Bootstrap 5 & Remix Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">

<div class="container text-center">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">

            <i class="ri-server-line text-danger" style="font-size: 6rem;"></i>

            <h1 class="display-1 fw-bold text-dark mt-3 mb-0">500</h1>
            <h3 class="fw-bold text-dark mb-4">Internal Server Error</h3>

            <p class="text-muted fs-5 mb-5" th:text="${message} ?: 'Oops! Something went wrong on our server. Please try again later.'">
                Oops! Something went wrong on our server. Please try again later.
            </p>

            <div class="d-flex justify-content-center gap-3">
                <button onclick="history.back()" class="btn btn-light border px-4 py-2 rounded-pill fw-medium shadow-sm">
                    <i class="ri-refresh-line me-1"></i> Try Again
                </button>
                <a th:href="@{/}" class="btn btn-primary px-4 py-2 rounded-pill shadow-sm fw-medium">
                    <i class="ri-home-4-line me-1"></i> Go to Homepage
                </a>
            </div>

        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
