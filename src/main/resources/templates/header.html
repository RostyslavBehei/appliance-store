<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<header th:fragment="navy" class="site-header shadow-sm">

    <!-- First Navigation Bar -->
    <div class="header-container bg-white py-3">
        <div class="container d-flex align-items-center justify-content-between gap-4">

            <!-- Logo -->
            <a href="/" class="logo text-decoration-none text-dark d-flex align-items-center gap-2">
                <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
                    <rect x="4" y="9" width="16" height="10"></rect>
                    <line x1="10" y1="4" x2="10" y2="9"></line>
                </svg>
                <span class="logo-text fs-4">Appliance<strong class="text-primary">Store</strong></span>
            </a>

            <!-- Search -->
            <form class="search-form flex-grow-1 position-relative" action="/" method="get" style="max-width: 500px;">
                <input
                        id="search"
                        name="keyword"
                        th:value="${keyword}"
                        type="search"
                        class="form-control rounded-pill pe-5 border-secondary-subtle"
                        th:placeholder="#{header.search.placeholder}"
                        th:aria-label="#{header.search.label}"
                >
                <button type="submit" class="btn position-absolute top-50 end-0 translate-middle-y border-0 text-primary" aria-label="Знайти">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                </button>
            </form>

            <!-- Actions -->
            <div class="header-actions d-flex align-items-center gap-3">

                <!-- Admin Panel -->
                <a sec:authorize="hasRole('ADMIN')" href="/admin" class="alert-danger action-item text-decoration-none text-dark d-flex flex-column align-items-center" aria-label="Admin Panel">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    <span th:text="#{header.button.admin}" class="small mt-1">Admin</span>
                </a>

                <!-- Employee Panel -->
                <a sec:authorize="hasRole('EMPLOYEE')" href="/employee-panel" class="alert-danger action-item text-decoration-none text-dark d-flex flex-column align-items-center" aria-label="Admin Panel">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>
                    <span th:text="#{header.button.employee-panel}" class="small mt-1">Employee Panel</span>
                </a>

                <!-- Block for Unauthorized -->
                <div sec:authorize="!isAuthenticated()" class="d-flex gap-2 align-items-center ms-2">
                    <a href="/login" class="btn btn-outline-primary btn-sm rounded-pill px-3 fw-bold">Log in</a>
                </div>

                <!-- Language Switcher -->
                <div class="dropdown">
                    <button class="action-item border-0 bg-transparent d-flex flex-column align-items-center text-dark" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="10"></circle>
                            <line x1="2" y1="12" x2="22" y2="12"></line>
                            <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                        </svg>
                        <span th:text="#{header.button.language}" class="small mt-1">Lang</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li><a class="dropdown-item" th:href="@{''(lang='en')}">English</a></li>
                        <li><a class="dropdown-item" th:href="@{''(lang='uk')}">Ukrainian</a></li>
                    </ul>
                </div>

                <!-- Block fromEntity Authorized -->
                <div sec:authorize="isAuthenticated()" class="dropdown">
                    <button class="action-item border-0 bg-transparent d-flex flex-column align-items-center text-primary" type="button" data-bs-toggle="dropdown" aria-expanded="false">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                        <span th:text="#{header.button.user}" class="small mt-1 fw-bold" sec:authentication="name">User</span>
                    </button>
                    <ul class="dropdown-menu dropdown-menu-end shadow-sm">
                        <li><a th:text="#{header.button.user.profile}" class="dropdown-item" href="/profile">👤 My profile</a></li>
                        <li><a th:text="#{header.button.user.orders}" class="dropdown-item" href="/orders">📦 My orders</a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <form th:action="@{/logout}" method="post" class="m-0">
                                <button th:text="#{header.button.user.logout}" type="submit" class="dropdown-item text-danger">🚪 Logout</button>
                            </form>
                        </li>
                    </ul>
                </div>

                <!-- Cart -->
                <a href="/cart" class="action-item text-decoration-none text-dark d-flex flex-column align-items-center position-relative" aria-label="Cart">
                    <div class="position-relative">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                        <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                              style="font-size: 0.65rem;"
                              th:text="${cartItemCount ?: 0}">
                        </span>
                    </div>
                    <span th:text="#{header.button.cart}" class="small mt-1">Cart</span>
                </a>

            </div>
        </div>
    </div>
    <!-- \First Navigation Bar -->

    <!-- Second Navigation Bar -->
    <nav class="secondary-nav bg-primary text-white">
        <div class="container">
            <ul class="nav mb-0 d-flex align-items-center gap-2 py-1">

                <li class="nav-item">
                    <a href="/" th:text="#{header.button.main}" class="nav-link text-white fw-medium px-3 rounded hover-bg-dark">Main</a>
                </li>

                <li class="nav-item dropdown">
                    <a href="#" class="nav-link text-white fw-medium px-3 rounded dropdown-toggle hover-bg-dark" data-bs-toggle="dropdown">
                        <i class="ri-menu-2-line align-middle me-1"></i>
                        <span th:text="#{header.button.catalog}">Product Catalog</span>
                    </a>
                    <ul class="dropdown-menu shadow">
                        <li th:each="category : ${categories}">
                            <a class="dropdown-item"
                               th:href="@{/category/{name}(name=${category.name()})}"
                               th:text="${category.name()}"></a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item dropdown">
                    <a th:text="#{header.button.brands}" href="#" class="nav-link text-white fw-medium px-3 rounded dropdown-toggle hover-bg-dark" data-bs-toggle="dropdown">
                        Brands
                    </a>
                    <ul class="dropdown-menu shadow">
                        <li th:each="brand : ${brands}">
                            <a class="dropdown-item"
                               th:href="@{/brand/{name}(name=${brand})}"
                               th:text="${brand}"></a>
                        </li>
                    </ul>
                </li>

                <li class="nav-item ms-auto">
                    <a href="/about" th:text="#{header.button.about}" class="nav-link text-white-50 px-3 hover-text-white">About us</a>
                </li>

                <li class="nav-item">
                    <a href="/contact" th:text="#{header.button.contacts}" class="nav-link text-white-50 px-3 hover-text-white">Contacts</a>
                </li>
            </ul>
        </div>
    </nav>
    <!-- \Second Navigation Bar -->

    <style>
        .hover-bg-dark:hover {
            background-color: rgba(0, 0, 0, 0.15);
            transition: 0.2s;
        }
        .hover-text-white:hover {
            color: #ffffff !important;
        }
    </style>
</header>
</body>
</html>
