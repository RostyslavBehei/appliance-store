<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="#{user.profile.update.page_title}">Update Profile - Appliance Store</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/main.css}">
    <link rel="icon" href="data:,">
</head>
<body class="bg-light d-flex flex-column min-vh-100">

<header th:insert="~{header::navy}"></header>

<main class="flex-grow-1 py-5">
    <div class="container">
        <div class="row justify-content-center">

            <div class="col-lg-4 mb-4 mb-lg-0">
                <div class="card border-0 rounded shadow-sm text-center p-4">
                    <div class="bg-primary bg-opacity-10 text-primary rounded-circle d-inline-flex align-items-center justify-content-center mx-auto mb-3" style="width: 100px; height: 100px;">
                        <i class="ri-user-line" style="font-size: 3rem;"></i>
                    </div>

                    <h4 class="fw-bold mb-1" th:text="|${user.firstName} ${user.lastName}|">John Doe</h4>
                    <p class="text-muted mb-3" th:text="${user.email}">user@example.com</p>

                    <hr class="my-4">

                    <div class="list-group list-group-flush text-start">
                        <a href="/profile" class="list-group-item list-group-item-action border-0 rounded mb-1">
                            <i class="ri-user-settings-line me-2 align-middle"></i> <span th:text="#{user.profile.update.nav_personal_info}">Personal Info</span>
                        </a>

                        <a href="/profile/update" class="list-group-item list-group-item-action border-0 active bg-primary text-white rounded mb-1">
                            <i class="ri-edit-box-line me-2 align-middle"></i> <span th:text="#{user.profile.update.nav_update_profile}">Update Profile</span>
                        </a>

                        <a href="/orders" class="list-group-item list-group-item-action border-0 rounded mb-1">
                            <i class="ri-shopping-bag-3-line me-2 align-middle"></i> <span th:text="#{user.profile.update.nav_my_orders}">My Orders</span>
                        </a>

                        <form th:action="@{/logout}" method="post" class="m-0 mt-2">
                            <button type="submit" class="list-group-item list-group-item-action border-0 text-danger rounded w-100 text-start">
                                <i class="ri-logout-box-r-line me-2 align-middle"></i> <span th:text="#{user.profile.update.nav_logout}">Logout</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card border-0 rounded shadow-sm">
                    <div class="card-header bg-white border-bottom p-4">
                        <h4 class="fw-bold mb-0" th:text="#{user.profile.update.title}">Update Personal Details</h4>
                    </div>
                    <div class="card-body p-4">

                        <form th:action="@{/profile/update}" method="post">
                            <div class="row g-3 mb-4">

                                <div class="col-md-6">
                                    <label class="form-label text-muted small mb-1" th:text="#{user.profile.update.first_name}">First Name</label>
                                    <input type="text" class="form-control" name="firstName" th:value="${user.firstName}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small mb-1" th:text="#{user.profile.update.last_name}">Last Name</label>
                                    <input type="text" class="form-control" name="lastName" th:value="${user.lastName}" required>
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small mb-1" th:text="#{user.profile.update.middle_name}">Middle Name</label>
                                    <input type="text" class="form-control" name="middleName" th:value="${user.middleName}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label text-muted small mb-1" th:text="#{user.profile.update.birthday}">Birthday</label>
                                    <input type="date" class="form-control" name="birthday" th:value="${user.birthday}">
                                </div>

                                <th:block sec:authorize="hasRole('ADMIN')">

                                    <div class="col-12 mt-4">
                                        <h6 class="text-danger border-bottom pb-2"><i class="ri-shield-keyhole-line me-1"></i> <span th:text="#{user.profile.update.admin_privileges}">Admin Privileges</span></h6>
                                    </div>

                                    <div class="col-md-6" th:if="${isClient}">
                                        <label class="form-label text-danger small mb-1" th:text="#{user.profile.update.discount_card}">Discount Card</label>
                                        <input type="text" class="form-control border-danger border-opacity-50" name="card" th:value="${user.card}">
                                    </div>

                                    <div class="col-md-6" th:if="${isEmployee}">
                                        <label class="form-label text-danger small mb-1" th:text="#{user.profile.update.department}">Department</label>
                                        <input type="text" class="form-control border-danger border-opacity-50" name="department" th:value="${user.department}">
                                    </div>

                                </th:block>
                            </div>

                            <div class="text-end">
                                <button type="submit" class="btn btn-primary px-4 fw-medium shadow-sm" th:text="#{user.profile.update.submit}">Save Changes</button>
                            </div>
                        </form>

                    </div>
                </div>
            </div>

        </div>
    </div>
</main>

<div th:insert="~{footer::footer}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
