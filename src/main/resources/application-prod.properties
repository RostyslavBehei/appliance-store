# Application Config
app.base-url=${APP_BASE_URL}

# Server Config
server.port=8080
server.error.include-stacktrace=never
server.error.include-message=never

# Jwt Config
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}

# Database Config
spring.datasource.url=${POSTGRESQL_DATABASE_URL}
spring.datasource.driver-class-name=${POSTGRESQL_DATABASE_DRIVER}
spring.datasource.username=${POSTGRESQL_DATABASE_USERNAME}
spring.datasource.password=${POSTGRESQL_DATABASE_PASSWORD}

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=update

spring.main.allow-bean-definition-overriding=true
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
#spring.sql.init.data-locations=classpath:manufacturer.sql, classpath:employee.sql, classpath:client.sql, classpath:appliance.sql, classpath:order.sql

# Messages Config
spring.messages.basename=messages/messages
spring.messages.encoding=UTF-8

# Logger Config
logging.level.root=WARN
logging.level.com.epam.rd.autocode.assessment.appliances=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=ERROR
logging.level.com.zaxxer.hikari=WARN

logging.file.name=logs/appliance-store-prod.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

logging.logback.rollingpolicy.file-name-pattern=logs/archived/appliance-store-%d{yyyy-MM-dd}.%i.log.gz
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.total-size-cap=2GB
logging.logback.rollingpolicy.clean-history-on-start=false

# Mail Config
spring.mail.host=${MAIL_SMTP}
spring.mail.port=${MAIL_PORT}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Redis Config
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.password=${REDIS_PASSWORD:}
spring.cache.redis.time-to-live=${REDIS_TTL:60}
spring.cache.redis.cache-null-values=false

# OAuth2 Config
spring.security.oauth2.client.registration.google.client-id=${SPRING_OAUTH2_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${SPRING_OAUTH2_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=email,profile
